plugins {
    id 'org.springframework.boot' version '3.4.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '6.25.0' apply false
}

// ---------------------------------------------------------------------------
// Shared configuration applied to every subproject.
// ---------------------------------------------------------------------------
subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'

    group = 'com.example'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    // Import the Spring Boot BOM so all subprojects share consistent versions.
    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-parameters' << '-Xlint:all' << '-Xlint:-processing' << '-Xlint:-serial'
        options.deprecation = true
        options.warnings = true
    }

    test {
        useJUnitPlatform()
        outputs.upToDateWhen { false }
        testLogging {
            events 'passed', 'failed', 'skipped'
        }
    }

    // ---------------------------------------------------------------------------
    // Spotless — import ordering, unused import removal, trailing whitespace.
    // Run `./gradlew spotlessApply` to auto-fix, `./gradlew spotlessCheck` to gate.
    //
    // Import groups (blank line between each):
    //   1. com.example.*          — project-internal
    //   2. (everything else)      — third-party (com.fasterxml, io, jakarta, org)
    //   3. java.*, javax.*        — JDK standard library
    // ---------------------------------------------------------------------------
    spotless {
        java {
            importOrder('com.example', '', 'java', 'javax')
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}

// ---------------------------------------------------------------------------
// generateMessages — produces ready-to-send IIF metrics Kafka message payloads.
//
// Agreement product numbers and product combos are derived by replicating
// IifDataSeeder's deterministic Random(42) sequence so that every generated
// message references data that will exist in the seeded H2/Postgres database.
//
// Usage:
//   gradle generateMessages
//   gradle generateMessages -Pcount=200
//   gradle generateMessages -Pcount=500 -PoutDir=/tmp/msgs
//
// Parameters (all optional):
//   count  — number of messages to generate (default: 1000)
//   outDir — output directory               (default: build/generated-messages)
//
// Output: <outDir>/messages-<count>.jsonl  (one JSON object per line)
// ---------------------------------------------------------------------------
tasks.register('generateMessages') {
    group = 'kafka'
    description = 'Generates IIF metrics Kafka message payloads matched to seeded reference data.'

    def cfg_count  = (project.findProperty('count')  ?: '1000').toInteger()
    def cfg_outDir = (project.findProperty('outDir') ?: layout.buildDirectory.dir('generated-messages').get().asFile.path)

    doLast {
        int    count  = cfg_count
        String outDir = cfg_outDir

        // ------------------------------------------------------------------
        // Replicate IifDataSeeder's Random(42) to derive the 250 valid
        // agreementProductNbr values that have PolicyAor (and therefore
        // Producer + CfmPgPoints) records in the seeded database.
        // ------------------------------------------------------------------
        def ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.toCharArray()
        def seederRandom = new Random(42)

        // 1 000 policies — matches POLICY_COUNT in IifDataSeeder
        def policies = (1..1000).collect {
            def sb = new StringBuilder(15)
            15.times { sb.append(ALPHA[seederRandom.nextInt(ALPHA.length)]) }
            sb.toString()
        }

        // Shuffle with the same Random instance — matches Collections.shuffle(shuffled, random)
        def shuffled = new ArrayList<>(policies)
        Collections.shuffle(shuffled, seederRandom)

        // First 250 have AOR records — matches AOR_COUNT in IifDataSeeder
        def validApns = shuffled.subList(0, 250)

        // ------------------------------------------------------------------
        // Product combos seeded into cfm_pg_points by IifDataSeeder
        // ------------------------------------------------------------------
        def combos = [
            [productFamilyEntCd: 'transport', productSubFamilyEntCd: 'auto' ],
            [productFamilyEntCd: 'transport', productSubFamilyEntCd: 'auto' ],
            [productFamilyEntCd: 'dwelling',  productSubFamilyEntCd: 'home' ],
            [productFamilyEntCd: 'dwelling',  productSubFamilyEntCd: 'home' ],
            [productFamilyEntCd: 'dwelling',  productSubFamilyEntCd: 'home' ],
        ]

        def rng   = new Random()
        def lines = []

        count.times {
            def apn   = validApns[rng.nextInt(validApns.size())]
            def combo = combos[rng.nextInt(combos.size())]

            def msg = [
                header: [
                    messageId        : UUID.randomUUID().toString(),
                    interactionId    : UUID.randomUUID().toString(),
                    sourceSystemEntCd: 'IIF'
                ],
                payload: [
                    agreementId          : UUID.randomUUID().toString(),
                    agreementProductNbr  : apn,
                    productFamilyEntCd   : combo.productFamilyEntCd,
                    productSubFamilyEntCd: combo.productSubFamilyEntCd,
                    assetId              : String.format('ASSET%07d', rng.nextInt(9_999_999))
                ]
            ]
            lines << groovy.json.JsonOutput.toJson(msg)
        }

        def outputDir = new File(outDir)
        outputDir.mkdirs()
        def outFile = new File(outputDir, "messages-${count}.jsonl")
        outFile.text = lines.join('\n') + '\n'

        println ""
        println "Generated ${count} messages → ${outFile.absolutePath}"
        println "  ${validApns.size()} valid agreementProductNbrs available (from seeded data)"
        println "  ${combos.size()} product combos (transport/auto, dwelling/home, ...)"
        println ""
    }
}
